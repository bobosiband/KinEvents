name: EmailService CI

on:
  pull_request:
    paths:
      - "EmailService/**"
      - ".github/workflows/email-service-ci.yml"
  push:
    branches:
      - main
    paths:
      - "EmailService/**"
      - ".github/workflows/email-service-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmailService
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EmailService/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
