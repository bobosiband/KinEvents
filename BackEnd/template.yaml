AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KinEvents backend (AWS SAM)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 25
    MemorySize: 1769
  Api:
    EndpointConfiguration: REGIONAL

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  SendgridApiKey:
    Type: String
    NoEcho: true
  AppUrl:
    Type: String
    Default: https://kinevents.vercel.app
  MongoDbUri:
    Type: String
    NoEcho: true
  MongoDbName:
    Type: String
    Default: kinevents
  GmailUser:
    Type: String
    NoEcho: true
    Default: ""
  GmailAppPassword:
    Type: String
    NoEcho: true
    Default: ""
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ""
  EmailFromName:
    Type: String
    Default: KinEvents
  EmailServiceUrl:
    Type: String
    Default: ""
    Description: Base URL of the standalone EmailService API; if set, backend sends via it.
  EmailServiceApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared API key the backend uses to call EmailService.

Resources:
  KinEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/src/lambda.handler
      CodeUri: .lambda-pkg/
      Environment:
        Variables:
          NODE_ENV: production
          JWT_SECRET: !Ref JwtSecret
          SENDGRID_API_KEY: !Ref SendgridApiKey
          APP_URL: !Ref AppUrl
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          GMAIL_USER: !Ref GmailUser
          GMAIL_APP_PASSWORD: !Ref GmailAppPassword
          RESEND_API_KEY: !Ref ResendApiKey
          EMAIL_FROM_NAME: !Ref EmailFromName
          EMAIL_SERVICE_URL: !Ref EmailServiceUrl
          EMAIL_SERVICE_API_KEY: !Ref EmailServiceApiKey
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
