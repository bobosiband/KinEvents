AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: KinEvents backend (AWS SAM)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 25
    MemorySize: 1769
  Api:
    EndpointConfiguration: REGIONAL
    # API-Gateway-level CORS so OPTIONS preflights succeed even on Lambda
    # cold-start and don't depend on Express middleware running first.
    Cors:
      AllowOrigin: "'*'"
      AllowHeaders: "'Content-Type,Authorization,X-Requested-With,Accept,Origin,X-Idempotency-Key'"
      AllowMethods: "'GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS'"
      MaxAge: "'86400'"

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
  SendgridApiKey:
    Type: String
    NoEcho: true
  AppUrl:
    Type: String
    Default: https://kinevents.vercel.app
  MongoDbUri:
    Type: String
    NoEcho: true
  MongoDbName:
    Type: String
    Default: kinevents
  GmailUser:
    Type: String
    NoEcho: true
    Default: ""
  GmailAppPassword:
    Type: String
    NoEcho: true
    Default: ""
  ResendApiKey:
    Type: String
    NoEcho: true
    Default: ""
  EmailFromName:
    Type: String
    Default: KinEvents
  EmailServiceUrl:
    Type: String
    Default: ""
    Description: Base URL of the standalone EmailService API; if set, backend sends via it.
  EmailServiceApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Shared API key the backend uses to call EmailService.
  OwnerEmail:
    Type: String
    Default: ""
    Description: The single owner account's email; used by OwnerPolicy.
  FeatureUseCollections:
    Type: String
    Default: "false"
  FeatureShadowWrites:
    Type: String
    Default: "false"
  FeatureAdminPin:
    Type: String
    Default: "false"
  FeatureCalendarSync:
    Type: String
    Default: "false"
  FeatureEventComments:
    Type: String
    Default: "false"
  FeatureWishesWall:
    Type: String
    Default: "false"
  FeatureSharedLists:
    Type: String
    Default: "false"
  FeaturePaymentsLedger:
    Type: String
    Default: "false"

Resources:
  KinEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/src/lambda.handler
      CodeUri: .lambda-pkg/
      Environment:
        Variables:
          NODE_ENV: production
          JWT_SECRET: !Ref JwtSecret
          SENDGRID_API_KEY: !Ref SendgridApiKey
          APP_URL: !Ref AppUrl
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          GMAIL_USER: !Ref GmailUser
          GMAIL_APP_PASSWORD: !Ref GmailAppPassword
          RESEND_API_KEY: !Ref ResendApiKey
          EMAIL_FROM_NAME: !Ref EmailFromName
          EMAIL_SERVICE_URL: !Ref EmailServiceUrl
          EMAIL_SERVICE_API_KEY: !Ref EmailServiceApiKey
          OWNER_EMAIL: !Ref OwnerEmail
          FEATURE_USE_COLLECTIONS: !Ref FeatureUseCollections
          FEATURE_SHADOW_WRITES: !Ref FeatureShadowWrites
          FEATURE_ADMIN_PIN: !Ref FeatureAdminPin
          FEATURE_CALENDAR_SYNC: !Ref FeatureCalendarSync
          FEATURE_EVENT_COMMENTS: !Ref FeatureEventComments
          FEATURE_WISHES_WALL: !Ref FeatureWishesWall
          FEATURE_SHARED_LISTS: !Ref FeatureSharedLists
          FEATURE_PAYMENTS_LEDGER: !Ref FeaturePaymentsLedger
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  ScheduledJobRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/src/lambda-scheduler.handler
      CodeUri: .lambda-pkg/
      Timeout: 300
      Environment:
        Variables:
          NODE_ENV: production
          JWT_SECRET: !Ref JwtSecret
          SENDGRID_API_KEY: !Ref SendgridApiKey
          APP_URL: !Ref AppUrl
          MONGODB_URI: !Ref MongoDbUri
          MONGODB_DB_NAME: !Ref MongoDbName
          GMAIL_USER: !Ref GmailUser
          GMAIL_APP_PASSWORD: !Ref GmailAppPassword
          RESEND_API_KEY: !Ref ResendApiKey
          EMAIL_FROM_NAME: !Ref EmailFromName
          EMAIL_SERVICE_URL: !Ref EmailServiceUrl
          EMAIL_SERVICE_API_KEY: !Ref EmailServiceApiKey
          OWNER_EMAIL: !Ref OwnerEmail
          FEATURE_USE_COLLECTIONS: !Ref FeatureUseCollections
          FEATURE_SHADOW_WRITES: !Ref FeatureShadowWrites
          FEATURE_ADMIN_PIN: !Ref FeatureAdminPin
          FEATURE_CALENDAR_SYNC: !Ref FeatureCalendarSync
          FEATURE_EVENT_COMMENTS: !Ref FeatureEventComments
          FEATURE_WISHES_WALL: !Ref FeatureWishesWall
          FEATURE_SHARED_LISTS: !Ref FeatureSharedLists
          FEATURE_PAYMENTS_LEDGER: !Ref FeaturePaymentsLedger
      Events:
        Daily07Sydney:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7 * * ? *)"
            ScheduleExpressionTimezone: "Australia/Sydney"
            State: ENABLED
            Description: "Runs KinEvents daily scheduled jobs at 07:00 Australia/Sydney"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  ScheduledJobRunnerArn:
    Description: "ARN of the scheduled job runner Lambda"
    Value: !GetAtt ScheduledJobRunnerFunction.Arn
